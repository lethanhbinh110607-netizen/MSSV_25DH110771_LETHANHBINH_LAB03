<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ví dụ 2 - Javascript</title>

    <script language="JavaScript">
        function HienThi(name) {
            // Khai báo một hàm tên là HienThi
            alert(name); // Lấy nội dung truyền vào và hiển thị lên cửa sổ thông báo
        }
    </script>
</head>
<body>
    <form name="form1">
        <!-- Nút bấm gọi hàm HienThi và truyền giá trị của ô textbox có tên là 'msg' -->
        <input type="button" name="welcome" value="Welcome" onclick="HienThi(msg.value);" />

        <!-- Ô textbox để nhập lời chào -->
        <input type="text" name="msg" value="Welcome to JavaScript" size="30" />
    </form>
</body>
</html>

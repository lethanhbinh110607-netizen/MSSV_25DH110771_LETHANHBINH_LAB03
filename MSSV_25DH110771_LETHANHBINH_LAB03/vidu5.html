<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ví dụ 5 - Validate</title>
    <script language="javascript">
        function Respond() {
            // Lấy danh sách các radio button có name là "checkbox"
            var check = document.getElementsByName("checkbox");

            // Kiểm tra xem radio button nào được chọn
            if (check[0].checked == true) { // Nút "Phải" (index 0)
                document.getElementById('huflit').innerHTML = "Tôi là sinh viên khoa CNTT, trường Huflit";
            }
            if (check[1].checked == true) { // Nút "Không phải" (index 1)
                document.getElementById('huflit').innerHTML = "Tôi không phải sinh viên khoa CNTT, trường Huflit";
            }
        }
    </script>
</head>
<body>
    <h4>Bạn có phải là sinh viên khoa CNTT, trường Huflit không?</h4>

    <!-- Các radio button cần có cùng name ("checkbox") để chỉ được chọn 1 trong 2 -->
    <input type="radio" name="checkbox" id="chon1" value="phai" /> Phải <br />
    <input type="radio" name="checkbox" id="chon2" value="khongphai" /> Không phải <br />

    <!-- Nút bấm gọi hàm Respond -->
    <input type="button" value="Câu trả lời" onclick="Respond();" /> <br />

    <!-- Thẻ span để hiển thị kết quả -->
    <span id="huflit" style="font-weight: bold; color: blue;"></span>

</body>
</html>
